name: Project Manager y revisor IA
on:
  issues:
    types: [opened, edited, reopened, closed, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Operación
        type: choice
        options: [plan, review, sync, sync-project, setup]
        required: true
      number:
        description: Número de issue/PR (vacío para setup)
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
  copilot-requests: write
jobs:
  manage:
    if: >-
      (github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/pm '))) &&
      (github.event_name != 'issues' || github.event.action != 'labeled' || startsWith(github.event.label.name, 'status:'))
    concurrency:
      group: pm-${{ github.event.issue.number || github.event.pull_request.number || inputs.number || 'setup' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Siempre scripts de main. Jamás ejecutar el código propuesto por el PR con permisos de escritura.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Instalar motor de IA
        run: npm install --global @github/copilot@1.0.103 --no-audit --no-fund
      - name: Gestionar evento
        run: node automation/bot.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
